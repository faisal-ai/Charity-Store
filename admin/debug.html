<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f8f9fa;
        }
        .debug-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Admin Login Debug</h1>

    <div class="debug-info">
        <h3>JavaScript Files Status</h3>
        <div id="datamanager-status"></div>
        <div id="utils-status"></div>
    </div>

    <div class="debug-info">
        <h3>Authentication Test</h3>
        <button onclick="testLogin()">Test Login (admin/admin123)</button>
        <div id="auth-result"></div>
    </div>

    <div class="debug-info">
        <h3>Admin Users Data</h3>
        <button onclick="showAdminUsers()">Show Admin Users</button>
        <div id="admin-users"></div>
    </div>

    <script src="../js/dataManager.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        // Check if files are loaded
        document.addEventListener('DOMContentLoaded', function() {
            const dataManagerStatus = document.getElementById('datamanager-status');
            const utilsStatus = document.getElementById('utils-status');

            if (typeof dataManager !== 'undefined') {
                dataManagerStatus.innerHTML = '<div class="test-result success">✅ dataManager.js loaded successfully</div>';
            } else {
                dataManagerStatus.innerHTML = '<div class="test-result error">❌ dataManager.js failed to load</div>';
            }

            if (typeof utils !== 'undefined') {
                utilsStatus.innerHTML = '<div class="test-result success">✅ utils.js loaded successfully</div>';
            } else {
                utilsStatus.innerHTML = '<div class="test-result error">❌ utils.js failed to load</div>';
            }
        });

        function testLogin() {
            const resultDiv = document.getElementById('auth-result');

            try {
                // Test authentication
                const user = dataManager.authenticateAdmin('admin', 'admin123');

                if (user) {
                    resultDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Authentication successful!<br>
                            User ID: ${user.id}<br>
                            Username: ${user.username}<br>
                            Email: ${user.email}<br>
                            Role: ${user.role}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="test-result error">❌ Authentication failed - Invalid credentials</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="test-result error">❌ Error: ${error.message}</div>`;
            }
        }

        function showAdminUsers() {
            const resultDiv = document.getElementById('admin-users');

            try {
                const adminUsers = dataManager.getAdminUsers();
                resultDiv.innerHTML = `
                    <div class="test-result success">
                        <strong>Admin Users in localStorage:</strong><br>
                        <pre>${JSON.stringify(adminUsers, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="test-result error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
