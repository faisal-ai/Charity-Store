<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Admin Panel</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <nav class="admin-sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand">Charity Store</a>
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="donation-bookings.html"><span class="icon">📅</span> Donation Bookings</a></li>
                <li><a href="mentoring-bookings.html"><span class="icon">🎓</span> Mentoring Sessions</a></li>
                <li><a href="mentors.html"><span class="icon">👥</span> Mentors</a></li>
                <li><a href="donations.html"><span class="icon">💝</span> Donations</a></li>
                <li><a href="content.html"><span class="icon">📝</span> Content</a></li>
                <li><a href="settings.html" class="active"><span class="icon">⚙️</span> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header">
                <h1>Settings</h1>
                <div class="admin-user">
                    <button class="logout-btn" onclick="utils.logout()">Logout</button>
                </div>
            </div>

            <div class="row">
                <div class="col-6">
                    <div class="card">
                        <div class="card-header">
                            <h3>Site Settings</h3>
                        </div>
                        <div class="card-body">
                            <form id="settings-form">
                                <div class="form-group">
                                    <label for="site-name">Site Name</label>
                                    <input type="text" id="site-name" value="Charity Store">
                                </div>
                                <div class="form-group">
                                    <label for="tax-rate">Tax Rate (%)</label>
                                    <input type="number" id="tax-rate" value="8" min="0" max="100" step="0.1">
                                </div>
                                <div class="form-group">
                                    <label for="free-shipping">Free Shipping Threshold ($)</label>
                                    <input type="number" id="free-shipping" value="50" min="0" step="0.01">
                                </div>
                                <button type="submit" class="btn btn-primary">Save Settings</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-6">
                    <div class="card">
                        <div class="card-header">
                            <h3>Data Management</h3>
                        </div>
                        <div class="card-body">
                            <p>Manage your data and system settings.</p>
                            <button class="btn btn-outline" onclick="exportAllData()" style="width: 100%; margin-bottom: 10px;">
                                Export All Data
                            </button>
                            <button class="btn btn-outline" onclick="clearCache()" style="width: 100%; margin-bottom: 10px;">
                                Clear Cache
                            </button>
                            <button class="btn btn-outline" onclick="resetToDefaults()" style="width: 100%;">
                                Reset to Defaults
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/dataManager.js?v=11"></script>
    <script src="../js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!utils.requireAuth()) return;
            loadSettings();
        });

        function loadSettings() {
            const settings = dataManager.getSettings() || {};
            document.getElementById('tax-rate').value = (settings.taxRate || 0.08) * 100;
            document.getElementById('free-shipping').value = settings.freeShippingThreshold || 50;

            document.getElementById('settings-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveSettings();
            });
        }

        function saveSettings() {
            const settings = {
                siteName: document.getElementById('site-name').value,
                taxRate: parseFloat(document.getElementById('tax-rate').value) / 100,
                freeShippingThreshold: parseFloat(document.getElementById('free-shipping').value)
            };

            if (dataManager.updateSettings(settings)) {
                utils.showNotification('Settings saved successfully!', 'success');
            } else {
                utils.showNotification('Failed to save settings', 'error');
            }
        }

        function exportAllData() {
            const allData = {
                products: dataManager.getProducts(),
                orders: dataManager.getOrders(),
                donations: dataManager.getDonations(),
                settings: dataManager.getSettings()
            };
            utils.exportDataAsJSON(allData, `charity_store_backup_${new Date().toISOString().split('T')[0]}.json`);
        }

        function clearCache() {
            if (confirm('Are you sure you want to clear the cache?')) {
                utils.showNotification('Cache cleared successfully!', 'success');
            }
        }

        function resetToDefaults() {
            if (confirm('Are you sure you want to reset all data to defaults? This cannot be undone.')) {
                utils.clearAllData();
            }
        }
    </script>
</body>
</html>
