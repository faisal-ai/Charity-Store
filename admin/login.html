<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BU Mentoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background: #0d0d18;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ── Animated background orbs ── */
        .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #4338ca, transparent 70%);
            top: -140px; left: -100px;
            animation: drift1 12s ease-in-out infinite;
        }
        .orb-2 {
            width: 420px; height: 420px;
            background: radial-gradient(circle, #7c3aed, transparent 70%);
            bottom: -120px; right: -80px;
            animation: drift2 15s ease-in-out infinite;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #a78bfa, transparent 70%);
            top: 45%; left: 55%;
            animation: drift3 10s ease-in-out infinite;
        }
        @keyframes drift1 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(60px,40px) scale(1.1); }
        }
        @keyframes drift2 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(-50px,-40px) scale(1.08); }
        }
        @keyframes drift3 {
            0%,100% { transform: translate(0,0) scale(1); }
            40%      { transform: translate(-30px,50px) scale(1.12); }
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 44px 40px 36px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.45), 0 0 0 1px rgba(139,92,246,0.15);
            animation: cardIn 0.5s cubic-bezier(.22,.68,0,1.2) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo / header ── */
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-avatar {
            width: 68px; height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #312e81, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 8px 24px rgba(139,92,246,0.45);
        }
        .logo h2 {
            font-family: 'Playfair Display', serif;
            color: #1e1b4b;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 3px;
        }
        .logo p {
            color: #8b5cf6;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            border-radius: 7px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: white;
            color: #312e81;
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Form ── */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 0.85rem;
            letter-spacing: 0.2px;
        }

        .input-wrap { position: relative; }
        .input-wrap input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
            background: #fafbff;
            color: #1e1b4b;
        }
        .input-wrap input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: white;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
        }
        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1rem;
            padding: 2px;
            line-height: 1;
        }
        .eye-btn:hover { color: #8b5cf6; }

        .hint {
            margin-top: 7px;
            padding: 7px 11px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 7px;
            font-size: 0.78rem;
            color: #166534;
        }

        /* ── Buttons ── */
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4338ca 0%, #8b5cf6 100%);
            color: white;
            box-shadow: 0 4px 18px rgba(139,92,246,0.35);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(139,92,246,0.45); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ── Messages ── */
        .msg {
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 0.85rem;
            margin-bottom: 14px;
            text-align: center;
            line-height: 1.4;
        }
        .msg.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .msg.info    { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        /* ── Accounts list ── */
        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin: 22px 0 8px;
        }
        .accounts-list { max-height: 180px; overflow-y: auto; }
        .account-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
        .account-row span { color: #374151; }
        .del-btn {
            background: none; border: none;
            color: #ef4444; cursor: pointer;
            font-size: 0.8rem; font-weight: 600;
            font-family: inherit;
        }
        .del-btn:hover { text-decoration: underline; }

        /* ── Back link ── */
        .back-link {
            position: relative; z-index: 1;
            text-align: center;
            margin-top: 18px;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.5);
        }
        .back-link a { color: rgba(196,181,253,0.8); text-decoration: none; }
        .back-link a:hover { color: #c4b5fd; text-decoration: underline; }

        @media (max-width: 480px) {
            .card { padding: 32px 24px 28px; }
        }
    </style>
</head>
<body>
<!-- Animated background orbs -->
<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="card">
    <div class="logo">
        <div class="logo-avatar">BU</div>
        <h2>BU Mentoring</h2>
        <p>Admin Panel</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('create')">Create Account</button>
    </div>

    <!-- ── LOGIN PANEL ── -->
    <div id="tab-login" class="tab-panel active">
        <div id="login-msg"></div>
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="Enter username" autocomplete="username">
            </div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
                <button class="eye-btn" type="button" onclick="togglePwd('password', this)" title="Show/hide password">👁</button>
            </div>
            <div class="hint">Default: <strong>admin</strong> / <strong>BUMentoring2024!</strong></div>
        </div>
        <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    </div>

    <!-- ── CREATE ACCOUNT PANEL ── -->
    <div id="tab-create" class="tab-panel">
        <div id="create-msg"></div>
        <div class="form-group">
            <label for="new-username">Username *</label>
            <div class="input-wrap">
                <input type="text" id="new-username" placeholder="Choose a username">
            </div>
        </div>
        <div class="form-group">
            <label for="new-password">Password *</label>
            <div class="input-wrap">
                <input type="password" id="new-password" placeholder="Min 8 characters">
                <button class="eye-btn" type="button" onclick="togglePwd('new-password', this)" title="Show/hide password">👁</button>
            </div>
        </div>
        <div class="form-group">
            <label for="new-password2">Confirm Password *</label>
            <div class="input-wrap">
                <input type="password" id="new-password2" placeholder="Repeat password">
                <button class="eye-btn" type="button" onclick="togglePwd('new-password2', this)" title="Show/hide password">👁</button>
            </div>
        </div>
        <div class="form-group">
            <label for="new-name">Display Name</label>
            <div class="input-wrap">
                <input type="text" id="new-name" placeholder="e.g. Site Admin">
            </div>
        </div>
        <button class="btn btn-primary" onclick="createAccount()">Create Account</button>

        <!-- Existing accounts list -->
        <div class="section-label">Existing Accounts</div>
        <div id="accounts-list" class="accounts-list"></div>
    </div>
</div>

<div class="back-link">
    <a href="../home.html">← Back to Website</a>
</div>

<script>
    // ── Storage key ──────────────────────────────────────────────────────────
    const ACCOUNTS_KEY = 'bu_admin_accounts';

    // ── Built-in fallback credentials (always accepted) ──────────────────────
    const BUILTIN = [
        { username: 'admin', password: 'BUMentoring2024!', role: 'admin', name: 'Administrator' }
    ];

    // ── Helpers ──────────────────────────────────────────────────────────────
    function getAccounts() {
        try {
            return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]');
        } catch { return []; }
    }
    function saveAccounts(list) {
        localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list));
    }
    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.innerHTML = `<div class="msg ${type}">${text}</div>`;
    }
    function clearMsg(id) {
        document.getElementById(id).innerHTML = '';
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => {
            b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'create'));
        });
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-create').classList.toggle('active', tab === 'create');
        if (tab === 'create') renderAccountsList();
    }

    // ── Show / hide password ──────────────────────────────────────────────────
    function togglePwd(inputId, btn) {
        const input = document.getElementById(inputId);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? '🙈' : '👁';
    }

    // ── Login ─────────────────────────────────────────────────────────────────
    function doLogin() {
        clearMsg('login-msg');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showMsg('login-msg', 'Please enter both username and password.', 'error');
            return;
        }

        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        setTimeout(() => {
            // Check built-in accounts first, then localStorage accounts
            const all = [...BUILTIN, ...getAccounts()];
            const user = all.find(u => u.username === username && u.password === password);

            if (user) {
                sessionStorage.setItem('admin_user', JSON.stringify({
                    username: user.username,
                    name: user.name || user.username,
                    role: user.role || 'admin',
                    loginTime: Date.now()
                }));
                showMsg('login-msg', '✅ Login successful! Redirecting…', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
            } else {
                showMsg('login-msg', 'Invalid username or password. Try <strong>admin</strong> / <strong>BUMentoring2024!</strong>', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }, 400);
    }

    // ── Create account ────────────────────────────────────────────────────────
    function createAccount() {
        clearMsg('create-msg');
        const username  = document.getElementById('new-username').value.trim();
        const password  = document.getElementById('new-password').value;
        const password2 = document.getElementById('new-password2').value;
        const name      = document.getElementById('new-name').value.trim();

        if (!username || !password) {
            showMsg('create-msg', 'Username and password are required.', 'error'); return;
        }
        if (password.length < 8) {
            showMsg('create-msg', 'Password must be at least 8 characters.', 'error'); return;
        }
        if (password !== password2) {
            showMsg('create-msg', 'Passwords do not match.', 'error'); return;
        }

        const all = [...BUILTIN, ...getAccounts()];
        if (all.find(u => u.username === username)) {
            showMsg('create-msg', `Username "${username}" is already taken.`, 'error'); return;
        }

        const accounts = getAccounts();
        accounts.push({ username, password, name: name || username, role: 'admin', createdAt: Date.now() });
        saveAccounts(accounts);

        showMsg('create-msg', `✅ Account "<strong>${username}</strong>" created! You can now sign in.`, 'success');
        document.getElementById('new-username').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('new-password2').value = '';
        document.getElementById('new-name').value = '';
        renderAccountsList();
    }

    // ── Accounts list (manage panel) ──────────────────────────────────────────
    function renderAccountsList() {
        const list = document.getElementById('accounts-list');
        const accounts = getAccounts();

        if (!accounts.length) {
            list.innerHTML = '<p style="font-size:0.82rem;color:#94a3b8;padding:8px 0;">No custom accounts yet.</p>';
            return;
        }

        list.innerHTML = accounts.map((a, i) => `
            <div class="account-row">
                <span>👤 <strong>${a.username}</strong>${a.name && a.name !== a.username ? ` (${a.name})` : ''}</span>
                <button class="del-btn" onclick="deleteAccount(${i})">Delete</button>
            </div>`).join('');
    }

    function deleteAccount(index) {
        const accounts = getAccounts();
        const u = accounts[index];
        if (!u) return;
        if (!confirm(`Delete account "${u.username}"?`)) return;
        accounts.splice(index, 1);
        saveAccounts(accounts);
        renderAccountsList();
    }

    // ── Auto-redirect if already logged in ───────────────────────────────────
    if (sessionStorage.getItem('admin_user')) {
        window.location.href = 'dashboard.html';
    }
</script>
</body>
</html>
