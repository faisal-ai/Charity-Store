<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test - Admin Panel</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <nav class="admin-sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand">Charity Store</a>
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="active"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="donations.html"><span class="icon">💝</span> Donations</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-content">
            <!-- Header -->
            <div class="admin-header">
                <h1>Dashboard Test</h1>
                <div class="admin-user">
                    <span>Welcome, <strong>Admin</strong></span>
                    <button class="logout-btn">Logout</button>
                </div>
            </div>

            <!-- Dashboard Cards -->
            <div class="dashboard-cards">
                <div class="dashboard-card donation-bookings">
                    <div class="card-number">5</div>
                    <div class="card-label">Test Card</div>
                    <div class="card-change positive">Working</div>
                </div>
                <div class="dashboard-card mentoring-bookings">
                    <div class="card-number">3</div>
                    <div class="card-label">Another Test</div>
                    <div class="card-change positive">Also Working</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
