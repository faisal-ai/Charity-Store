<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🔥 Firebase Connection Test</h1>
    <p>This page tests if Firebase is properly connected and working.</p>

    <div id="status"></div>

    <h2>Actions:</h2>
    <button onclick="testFirebaseConnection()">Test Firebase Connection</button>
    <button onclick="testGetImages()">Test Get Images</button>
    <button onclick="testGetMentors()">Test Get Mentors</button>
    <button onclick="testAddTestMentor()">Add Test Mentor</button>

    <div id="results"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { db } from './js/firebase-config.js';
        window.dispatchEvent(new Event('firebaseReady'));
        window.firebaseDB = db;
        console.log('Firebase initialized on test page');
        addStatus('Firebase SDK loaded', 'success');
    </script>

    <script src="js/dataManager.js?v=12"></script>
    <script>
        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            document.getElementById('status').appendChild(div);
        }

        function showResults(data) {
            document.getElementById('results').innerHTML = `
                <h3>Results:</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        async function testFirebaseConnection() {
            try {
                addStatus('Testing Firebase connection...', 'info');
                if (window.firebaseDB) {
                    addStatus('✅ Firebase DB object exists', 'success');
                } else {
                    addStatus('❌ Firebase DB object not found', 'error');
                }
            } catch (error) {
                addStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function testGetImages() {
            try {
                addStatus('Getting images from dataManager...', 'info');
                const images = await dataManager.getImages();
                addStatus(`✅ Got ${images.length} images`, 'success');
                showResults(images.map(img => ({
                    name: img.name,
                    category: img.category,
                    size: img.size
                })));
            } catch (error) {
                addStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function testGetMentors() {
            try {
                addStatus('Getting mentors from dataManager...', 'info');
                const mentors = await dataManager.getMentors();
                addStatus(`✅ Got ${mentors.length} mentors`, 'success');
                showResults(mentors.map(m => ({
                    id: m.id,
                    name: m.name,
                    specialty: m.specialty || m.speciality
                })));
            } catch (error) {
                addStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function testAddTestMentor() {
            try {
                addStatus('Adding test mentor...', 'info');
                const testMentor = {
                    name: "Test Mentor " + Date.now(),
                    specialty: "Testing",
                    bio: "This is a test mentor",
                    experience: 5,
                    status: "active"
                };
                await dataManager.addMentor(testMentor);
                addStatus('✅ Test mentor added successfully', 'success');
                await testGetMentors();
            } catch (error) {
                addStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Auto-run connection test on load
        window.addEventListener('load', () => {
            setTimeout(testFirebaseConnection, 1000);
        });
    </script>
</body>
</html>
