<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergency Data Recovery</title>
    <style>
        body { font-family: Arial; max-width: 900px; margin: 50px auto; padding: 20px; }
        .status { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 15px 30px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
    </style>
</head>
<body>
    <h1>🚨 Emergency Data Recovery</h1>
    <p><strong>Your data is NOT lost!</strong> It's still in localStorage. Let's restore it properly.</p>

    <div id="status"></div>

    <h2>Step 1: Check Your Local Data</h2>
    <button class="btn-primary" onclick="showLocalData()">Show My Local Data</button>

    <h2>Step 2: Restore to Firebase (FIXED VERSION)</h2>
    <button class="btn-primary" onclick="restoreMentors()">Restore Mentors to Firebase</button>
    <button class="btn-primary" onclick="restoreImages()">Restore Images to Firebase</button>

    <div id="results"></div>

    <script type="module">
        import { db, collection, setDoc, doc } from './js/firebase-config.js';
        window.firebaseDB = db;
        window.firebaseCollection = collection;
        window.firebaseSetDoc = setDoc;
        window.firebaseDoc = doc;
        console.log('Firebase loaded for recovery');
    </script>

    <script>
        function addStatus(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = msg;
            document.getElementById('status').appendChild(div);
        }

        function showResults(title, data) {
            document.getElementById('results').innerHTML += `<h3>${title}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        function showLocalData() {
            const mentors = JSON.parse(localStorage.getItem('charity_store_mentors') || '[]');
            const images = JSON.parse(localStorage.getItem('charity_store_images') || '[]');

            addStatus(`<strong>Found in localStorage:</strong><br>Mentors: ${mentors.length}<br>Images: ${images.length}`,
                mentors.length > 0 || images.length > 0 ? 'success' : 'error');

            if (mentors.length > 0) {
                showResults('Your Mentors (SAFE in localStorage):', mentors.map(m => ({ id: m.id, name: m.name, specialty: m.specialty || m.speciality })));
            }
            if (images.length > 0) {
                showResults('Your Images (SAFE in localStorage):', images.map(i => ({ name: i.name, category: i.category })));
            }
        }

        async function restoreMentors() {
            try {
                addStatus('🔄 Restoring mentors to Firebase...', 'info');

                const mentors = JSON.parse(localStorage.getItem('charity_store_mentors') || '[]');

                if (mentors.length === 0) {
                    addStatus('⚠️ No mentors in localStorage', 'error');
                    return;
                }

                let restored = 0;
                for (const mentor of mentors) {
                    try {
                        // Use Firebase directly to save mentor with original ID
                        await window.firebaseSetDoc(
                            window.firebaseDoc(window.firebaseDB, 'mentors', mentor.id),
                            mentor
                        );
                        restored++;
                        addStatus(`✅ Restored: ${mentor.name}`, 'success');
                    } catch (error) {
                        addStatus(`❌ Failed: ${mentor.name} - ${error.message}`, 'error');
                    }
                }

                addStatus(`<strong>✅ Restored ${restored} of ${mentors.length} mentors!</strong>`, 'success');
                addStatus('Refresh the page and check your admin panel', 'info');

            } catch (error) {
                addStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function restoreImages() {
            try {
                addStatus('🔄 Restoring images to Firebase...', 'info');

                const images = JSON.parse(localStorage.getItem('charity_store_images') || '[]');

                if (images.length === 0) {
                    addStatus('⚠️ No images in localStorage', 'error');
                    return;
                }

                let restored = 0;
                for (const image of images) {
                    try {
                        await window.firebaseSetDoc(
                            window.firebaseDoc(window.firebaseDB, 'images', image.id),
                            {
                                ...image,
                                uploadedAt: image.uploadedAt || Date.now()
                            }
                        );
                        restored++;
                        addStatus(`✅ Restored: ${image.name}`, 'success');
                    } catch (error) {
                        addStatus(`❌ Failed: ${image.name} - ${error.message}`, 'error');
                    }
                }

                addStatus(`<strong>✅ Restored ${restored} of ${images.length} images!</strong>`, 'success');
                addStatus('Refresh the page and check your homepage', 'info');

            } catch (error) {
                addStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
