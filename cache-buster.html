<!-- Cache Buster Script - Forces reload of new version -->
<script>
(function() {
    const CURRENT_VERSION = '20260215-v2';
    const VERSION_KEY = 'site_version';

    // Check if we need to force reload
    const storedVersion = sessionStorage.getItem(VERSION_KEY);

    if (storedVersion !== CURRENT_VERSION) {
        console.log('🔄 New version detected, clearing cache...');

        // Clear all caches
        if ('caches' in window) {
            caches.keys().then(names => {
                names.forEach(name => caches.delete(name));
            });
        }

        // Clear localStorage (except important data)
        const keepKeys = ['charity_store_admin_users'];
        const toRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!keepKeys.includes(key)) {
                toRemove.push(key);
            }
        }
        toRemove.forEach(key => localStorage.removeItem(key));

        // Store new version
        sessionStorage.setItem(VERSION_KEY, CURRENT_VERSION);

        // Force hard reload if not already reloaded
        if (!location.search.includes('nocache')) {
            console.log('🔄 Forcing hard reload...');
            location.href = location.pathname + '?nocache=' + Date.now();
            return;
        }
    }

    console.log('✅ Cache buster: Version ' + CURRENT_VERSION + ' loaded');
})();
</script>
