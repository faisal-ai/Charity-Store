<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete System Diagnosis</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        h1 { color: #00ffff; text-align: center; }
        h2 { color: #ffff00; border-bottom: 2px solid #ffff00; padding-bottom: 10px; margin-top: 30px; }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 5px solid;
        }
        .success {
            background: #1a4d1a;
            color: #00ff00;
            border-color: #00ff00;
        }
        .error {
            background: #4d1a1a;
            color: #ff6b6b;
            border-color: #ff0000;
        }
        .info {
            background: #1a1a4d;
            color: #6bc8ff;
            border-color: #00aaff;
        }
        .warning {
            background: #4d4d1a;
            color: #ffff00;
            border-color: #ffaa00;
        }
        button {
            padding: 15px 30px;
            margin: 10px 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            background: #00ff00;
            color: #000;
        }
        button:hover { background: #00cc00; }
        .btn-danger { background: #ff0000; color: #fff; }
        .btn-danger:hover { background: #cc0000; }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
            border: 1px solid #333;
            color: #00ff00;
        }
        .timing { color: #ffaa00; font-weight: bold; }
        .count { color: #00ffff; font-size: 24px; font-weight: bold; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .panel h3 { margin-top: 0; color: #00ffff; }
    </style>
</head>
<body>
    <h1>🔍 Complete System Diagnosis</h1>
    <p style="text-align: center; color: #ffff00;">Real-time Firebase & Storage Analysis</p>

    <div id="status"></div>

    <h2>📊 Quick Actions</h2>
    <div style="text-align: center;">
        <button onclick="runFullDiagnosis()">🚀 Run Full Diagnosis</button>
        <button onclick="testFirebaseTiming()">⏱️ Test Firebase Timing</button>
        <button onclick="showLocalStorageData()">💾 Show localStorage Data</button>
        <button onclick="showFirebaseData()">☁️ Show Firebase Data</button>
        <button onclick="clearAllLogs()">🗑️ Clear Logs</button>
    </div>

    <div class="grid">
        <div class="panel">
            <h3>⏱️ Timing Analysis</h3>
            <div id="timing-analysis">Click "Test Firebase Timing" to start</div>
        </div>
        <div class="panel">
            <h3>💾 localStorage Status</h3>
            <div id="localstorage-status">Click "Show localStorage Data" to load</div>
        </div>
        <div class="panel">
            <h3>☁️ Firebase Status</h3>
            <div id="firebase-status">Click "Show Firebase Data" to load</div>
        </div>
        <div class="panel">
            <h3>🔧 System Info</h3>
            <div id="system-info"></div>
        </div>
    </div>

    <div id="results"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const startTime = performance.now();
        console.log('🔥 Firebase SDK import started at', startTime);

        const firebaseConfig = {
            apiKey: "AIzaSyBCvt35dMfwNY5PLW0gwbtdCcfputgcE6M",
            authDomain: "bu-mentoring.firebaseapp.com",
            projectId: "bu-mentoring",
            storageBucket: "bu-mentoring.firebasestorage.app",
            messagingSenderId: "172398452298",
            appId: "1:172398452298:web:ee8908b8eed565e03350b3",
            measurementId: "G-PT3DVJX0QG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firebaseDB = db;
        window.firebaseCollection = collection;
        window.firebaseGetDocs = getDocs;
        window.firebaseDoc = doc;
        window.firebaseGetDoc = getDoc;

        window.dispatchEvent(new Event('firebaseReady'));

        const endTime = performance.now();
        console.log('✅ Firebase ready event dispatched at', endTime);
        console.log('⏱️ Firebase initialization took', (endTime - startTime).toFixed(2), 'ms');

        window.firebaseLoadTime = endTime - startTime;
    </script>

    <script src="js/dataManager.js"></script>
    <script>
        let diagnosticStartTime = performance.now();
        let logs = [];

        function addLog(message, type = 'info') {
            const timestamp = (performance.now() - diagnosticStartTime).toFixed(2);
            logs.push({ timestamp, message, type });
            addStatus(`[${timestamp}ms] ${message}`, type);
        }

        function addStatus(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = msg;
            document.getElementById('status').appendChild(div);
        }

        function showResults(title, data) {
            document.getElementById('results').innerHTML += `
                <h2>${title}</h2>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        function clearAllLogs() {
            document.getElementById('status').innerHTML = '';
            document.getElementById('results').innerHTML = '';
            logs = [];
            diagnosticStartTime = performance.now();
            addLog('Logs cleared', 'info');
        }

        // System info
        function showSystemInfo() {
            const info = {
                userAgent: navigator.userAgent,
                cookiesEnabled: navigator.cookieEnabled,
                onLine: navigator.onLine,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: `${screen.width}x${screen.height}`,
                localStorageAvailable: typeof localStorage !== 'undefined',
                sessionStorageAvailable: typeof sessionStorage !== 'undefined'
            };

            document.getElementById('system-info').innerHTML = `
                <p><strong>Browser:</strong> ${info.userAgent.split(' ').slice(-1)[0]}</p>
                <p><strong>Online:</strong> ${info.onLine ? '✅' : '❌'}</p>
                <p><strong>Cookies:</strong> ${info.cookiesEnabled ? '✅' : '❌'}</p>
                <p><strong>localStorage:</strong> ${info.localStorageAvailable ? '✅' : '❌'}</p>
            `;

            return info;
        }

        async function testFirebaseTiming() {
            addLog('🔄 Testing Firebase initialization timing...', 'info');

            const timingDiv = document.getElementById('timing-analysis');
            const results = [];

            const t0 = performance.now();
            results.push(`Page load start: 0ms`);

            if (window.firebaseLoadTime) {
                results.push(`Firebase SDK loaded: ${window.firebaseLoadTime.toFixed(2)}ms`);
            }

            // Test dataManager initialization
            const t1 = performance.now();
            const dataManagerReady = typeof window.dataManager !== 'undefined';
            const t2 = performance.now();
            results.push(`dataManager check: ${(t2 - t1).toFixed(2)}ms (${dataManagerReady ? 'READY' : 'NOT READY'})`);

            // Test ensureFirebaseReady timing
            addLog('⏳ Waiting for Firebase to be ready...', 'info');
            const t3 = performance.now();
            try {
                await new Promise(resolve => {
                    if (window.dataManager && window.dataManager.getMentors) {
                        resolve();
                    } else {
                        setTimeout(resolve, 100);
                    }
                });
                const t4 = performance.now();
                results.push(`dataManager ready: ${(t4 - t3).toFixed(2)}ms`);

                // Test actual Firebase data fetch
                const t5 = performance.now();
                const images = await dataManager.getImages();
                const t6 = performance.now();
                results.push(`getImages() call: ${(t6 - t5).toFixed(2)}ms → <span class="count">${images.length}</span> images`);

                const t7 = performance.now();
                const mentors = await dataManager.getMentors();
                const t8 = performance.now();
                results.push(`getMentors() call: ${(t8 - t7).toFixed(2)}ms → <span class="count">${mentors.length}</span> mentors`);

                const totalTime = performance.now() - t0;
                results.push(`<br><strong>Total time: ${totalTime.toFixed(2)}ms</strong>`);

                timingDiv.innerHTML = results.map(r => `<p>${r}</p>`).join('');

                if (totalTime > 2000) {
                    addLog(`⚠️ WARNING: Total initialization took ${totalTime.toFixed(0)}ms - longer than 2-second delay!`, 'error');
                } else {
                    addLog(`✅ Total initialization: ${totalTime.toFixed(0)}ms (within 2-second delay)`, 'success');
                }

            } catch (error) {
                addLog(`❌ Error during timing test: ${error.message}`, 'error');
                timingDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }

        function showLocalStorageData() {
            addLog('📦 Reading localStorage...', 'info');

            try {
                const mentors = JSON.parse(localStorage.getItem('charity_store_mentors') || '[]');
                const images = JSON.parse(localStorage.getItem('charity_store_images') || '[]');

                const statusDiv = document.getElementById('localstorage-status');
                statusDiv.innerHTML = `
                    <p><span class="count">${mentors.length}</span> mentors</p>
                    <p><span class="count">${images.length}</span> images</p>
                    <p style="font-size: 12px; color: #888; margin-top: 10px;">
                        Size: ~${((JSON.stringify(mentors).length + JSON.stringify(images).length) / 1024).toFixed(1)} KB
                    </p>
                `;

                addLog(`✅ localStorage: ${mentors.length} mentors, ${images.length} images`, 'success');

                showResults('localStorage Mentors', mentors.map(m => ({
                    id: m.id,
                    name: m.name,
                    specialty: m.specialty || m.speciality,
                    createdAt: m.createdAt ? new Date(m.createdAt).toLocaleString() : 'N/A'
                })));

                showResults('localStorage Images (sample)', images.slice(0, 5).map(img => ({
                    id: img.id,
                    name: img.name,
                    category: img.category,
                    size: `${(img.data?.length / 1024).toFixed(1)} KB`
                })));

            } catch (error) {
                addLog(`❌ Error reading localStorage: ${error.message}`, 'error');
                document.getElementById('localstorage-status').innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }

        async function showFirebaseData() {
            addLog('☁️ Reading Firebase...', 'info');

            try {
                const statusDiv = document.getElementById('firebase-status');
                statusDiv.innerHTML = '<p>Loading...</p>';

                // Read directly from Firebase
                const mentorsSnapshot = await window.firebaseGetDocs(window.firebaseCollection(window.firebaseDB, 'mentors'));
                const imagesSnapshot = await window.firebaseGetDocs(window.firebaseCollection(window.firebaseDB, 'images'));

                const mentors = [];
                mentorsSnapshot.forEach(doc => {
                    mentors.push({ id: doc.id, ...doc.data() });
                });

                const images = [];
                imagesSnapshot.forEach(doc => {
                    images.push({ id: doc.id, ...doc.data() });
                });

                statusDiv.innerHTML = `
                    <p><span class="count">${mentors.length}</span> mentors</p>
                    <p><span class="count">${images.length}</span> images</p>
                    <p style="font-size: 12px; color: #888; margin-top: 10px;">
                        Direct from Firestore
                    </p>
                `;

                addLog(`✅ Firebase: ${mentors.length} mentors, ${images.length} images`, 'success');

                showResults('Firebase Mentors', mentors.map(m => ({
                    id: m.id,
                    name: m.name,
                    specialty: m.specialty || m.speciality,
                    experience: m.experience,
                    createdAt: m.createdAt ? new Date(m.createdAt).toLocaleString() : 'N/A'
                })));

                showResults('Firebase Images (sample)', images.slice(0, 5).map(img => ({
                    id: img.id,
                    name: img.name,
                    category: img.category,
                    uploadedAt: img.uploadedAt ? new Date(img.uploadedAt).toLocaleString() : 'N/A'
                })));

                // Compare with localStorage
                const localMentors = JSON.parse(localStorage.getItem('charity_store_mentors') || '[]');
                const localImages = JSON.parse(localStorage.getItem('charity_store_images') || '[]');

                if (mentors.length !== localMentors.length || images.length !== localImages.length) {
                    addLog(`⚠️ MISMATCH: Firebase has ${mentors.length} mentors and ${images.length} images, but localStorage has ${localMentors.length} mentors and ${localImages.length} images`, 'warning');
                }

            } catch (error) {
                addLog(`❌ Error reading Firebase: ${error.message}`, 'error');
                console.error('Firebase error:', error);
                document.getElementById('firebase-status').innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }

        async function runFullDiagnosis() {
            clearAllLogs();
            addLog('🚀 Starting full system diagnosis...', 'info');

            showSystemInfo();
            await testFirebaseTiming();
            showLocalStorageData();
            await showFirebaseData();

            addLog('✅ Full diagnosis complete!', 'success');
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                addLog('✅ Page loaded, ready for diagnosis', 'info');
                showSystemInfo();
            }, 500);
        });
    </script>
</body>
</html>
